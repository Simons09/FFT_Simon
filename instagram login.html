<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>
</head>

<body bgcolor="#0b0f12">

<table width="100%" height="750" border="0" cellspacing="0" cellpadding="0">

    <tr>

        <!-- LEFT SIDE -->
        <td width="58%" valign="top">

            <br><br>

            <table width="100%" border="0" cellspacing="0" cellpadding="20">

                <tr>
                    <td>

                        <font face="Arial" size="7" color="#ffffff">
                            <b>◎</b>
                        </font>

                    </td>
                </tr>

                <tr>
                    <td align="center">

                        <font face="Arial" size="6" color="#ffffff">
                            See everyday moments from your
                        </font>

                        <br><br>

                        <font face="Arial" size="6" color="#ff4b4b">
                            <b>close friends.</b>
                        </font>

                        <br><br><br>

                        <!-- IMAGE STYLE USING TABLES -->
                        <table border="0" cellspacing="5" cellpadding="0">

                            <tr>

                                <td width="100" height="220" bgcolor="#343b22" align="center">
                                    <font size="5">📸</font>
                                    <br><br>
                                    <font color="white" face="Arial">
                                        Story
                                    </font>
                                </td>

                                <td width="170" height="300" bgcolor="#665044" align="center">
                                    <font size="6">👭</font>
                                    <br><br>
                                    <font color="white" face="Arial">
                                        Friends
                                    </font>
                                </td>

                                <td width="100" height="220" bgcolor="#493b35" align="center">
                                    <font size="5">❤️</font>
                                    <br><br>
                                    <font color="white" face="Arial">
                                        Moments
                                    </font>
                                </td>

                            </tr>

                        </table>

                        <br>

                        <font size="5" color="#ff3366">
                            ❤️
                        </font>

                    </td>
                </tr>

            </table>

        </td>


        <!-- RIGHT SIDE -->
        <td width="42%" bgcolor="#1f1f22" valign="middle">

            <table width="85%" border="0" cellspacing="0" cellpadding="10" align="center">

                <tr>
                    <td>

                        <font face="Arial" size="5" color="#ffffff">
                            ‹ &nbsp;&nbsp; <b>Log into Instagram</b>
                        </font>

                        <br><br><br>


                        <!-- LOGIN FORM -->
                        <form>

                            <input
                                type="text"
                                name="username"
                                placeholder="Mobile number, username or email"
                                size="60"
                            >

                            <br><br>

                            <input
                                type="password"
                                name="password"
                                placeholder="Password"
                                size="60"
                            >

                            <br><br>

                            <input
                                type="submit"
                                value="Log in"
                            >

                            <br><br>

                            <center>

                                <font face="Arial" size="3" color="#ffffff">
                                    <b>Forgot password?</b>
                                </font>

                            </center>

                            <br><br><br>


                            <!-- FACEBOOK LOGIN -->
                            <input
                                type="button"
                                value="🔵  Log in with Facebook"
                            >

                            <br><br>


                            <!-- CREATE ACCOUNT -->
                            <input
                                type="button"
                                value="Create new account"
                            >

                            <br><br><br>

                            <center>

                                <font face="Arial" size="4" color="#dddddd">
                                    ∞ Meta
                                </font>

                            </center>

                        </form>

                    </td>
                </tr>

            </table>

        </td>

    </tr>

</table>

</body>
</html>
